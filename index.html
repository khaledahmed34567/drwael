async function setupFCM(){

// الرسوم البيانية والإحصائيات
const CHART_COLORS=['#C42341','#7928ca','#2563eb','#059669','#d97706','#dc2626','#0891b2','#4f46e5','#ec4899','#10b981'];

async function getStatsData(filterYear=0){
  let qDocs=[];
  try{
    if(filterYear&&filterYear>=1&&filterYear<=3){
      const snap=await getDocs(query(collection(db,"esalquestions"),where("year","==",filterYear),limit(300)));
      qDocs=snap.docs.map(d=>({id:d.id,...d.data()}));
    }else{
      try{
        const snap=await getDocs(query(collection(db,"esalquestions"),limit(300)));
        qDocs=snap.docs.map(d=>({id:d.id,...d.data()}));
      }catch(err){
        const results=await Promise.all([1,2,3].map(y=>
          getDocs(query(collection(db,"esalquestions"),where("year","==",y),limit(100))).catch(()=>({docs:[]}))
        ));
        qDocs=results.flatMap(r=>r.docs.map(d=>({id:d.id,...d.data()})));
      }
    }
  }catch(e){
    qDocs=Array.isArray(Q)?(filterYear?Q.filter(q=>q.year===filterYear):Q):[];
  }

  let dbSubjects=[];
  try{
    let subQuery;
    if(filterYear&&filterYear>=1&&filterYear<=3){
      subQuery=query(collection(db,"esalsubjects"),where("year","==",filterYear),where("status","==","approved"));
    }else{
      subQuery=query(collection(db,"esalsubjects"),where("status","==","approved"));
    }
    const sSnap=await getDocs(subQuery);
    dbSubjects=sSnap.docs.map(d=>d.data());
  }catch(e){}

  const subjectMap=new Map();
  // فقط المواد المعتمدة في قاعدة البيانات (esalsubjects)
  dbSubjects.forEach(s=>{
    if(s.name&&(!filterYear||s.year===filterYear)){
      if(!subjectMap.has(s.name)){
        subjectMap.set(s.name,{subject:s.name,year:s.year||1,questions:0,answered:0,interactions:0});
      }
    }
  });

  // والأسئلة الفعلية الموجودة في قاعدة البيانات
  qDocs.forEach(q=>{
    if(filterYear&&q.year&&q.year!==filterYear)return;
    const subName=(q.subject||"عام").trim();
    if(!subjectMap.has(subName)){
      subjectMap.set(subName,{subject:subName,year:q.year||1,questions:0,answered:0,interactions:0});
    }
    const item=subjectMap.get(subName);
    item.questions+=1;
    if(q.answer)item.answered+=1;
    item.interactions+=(q.answer?1:0)+(q.imgs?.length||0);
  });

  const list=Array.from(subjectMap.values());
  const totalQuestions=qDocs.length;
  const totalAnswered=qDocs.filter(q=>q.answer).length;
  const totalInteractions=list.reduce((acc,s)=>acc+s.interactions,0);
  const ansRate=totalQuestions?Math.round((totalAnswered/totalQuestions)*100):0;

  list.sort((a,b)=>(b.questions-a.questions)||(b.interactions-a.interactions)||a.subject.localeCompare(b.subject,"ar"));
  const activeSubs=list.filter(s=>s.questions>0);
  const chartData=(activeSubs.length>0?activeSubs:list).slice(0,10);
  const topSubject=activeSubs[0]?.subject||(totalQuestions>0?list[0]?.subject:"لا توجد أسئلة مسجلة بعد");

  return {
    chartData,
    allSubjects:list,
    totalQuestions,
    totalAnswered,
    totalInteractions,
    ansRate,
    topSubject
  };
}

ntent:space-between;margin-top:8px"><span class="meta" id="${scope}_topSubMeta">المادة الأكثر نشاطاً: --</span><div class="row" style="gap:6px"><button type="button" class="btn s o" id="${scope}_toggleFeedBtn" style="font-size:13px;padding:4px 12px;gap:5px">${I(IC.trash)}<span id="${scope}_toggleFeedTxt">${localStorage.hideStatsCard==='1'?'إظهار في الرئيسية':'حذف من الرئيسية'}</span></button><button type="button" class="btn s o" id="${scope}_refreshBtn" style="font-size:13px;padding:4px 12px;gap:5px">${I(IC.refresh)}<span>تحديث البيانات</span></button></div></div></div><div class="box" style="background:#fff;border-radius:22px;padding:18px;margin-bottom:12px"><h3 style="margin-bottom:10px;font-size:17px">تفاصيل المواد البيطرية من قاعدة البيانات</h3><div id="${scope}_subList" style="display:flex;flex-direction:column;gap:10px"></div></div>`;

function mountStatsCharts(scope,initYear=0){
  let selectedYear=initYear||(prof?.year||0);
  let selectedType='bar';
  const update=async()=>{
    const mountEl=document.getElementById(`${scope}_chartMount`);
    if(mountEl)mountEl.innerHTML=`<div class="meta" style="text-align:center;padding:60px 0">جارٍ قراءة البيانات الحية من قاعدة البيانات…</div>`;
    const stats=await getStatsData(selectedYear);
    const qEl=document.getElementById(`${scope}_totalQ`);
    const rEl=document.getElementById(`${scope}_ansRate`);
    const iEl=document.getElementById(`${scope}_totalInt`);
    const tMeta=document.getElementById(`${scope}_topSubMeta`);
    if(qEl)qEl.textContent=stats.totalQuestions;
    if(rEl)rEl.textContent=stats.ansRate+'%';
    if(iEl)iEl.textContent=stats.totalInteractions;
    if(tMeta)tMeta.textContent=stats.totalQuestions>0?`المادة الأكثر تفاعلاً: ${stats.topSubject} (${stats.chartData.find(s=>s.subject===stats.topSubject)?.interactions||stats.totalInteractions} تفاعل)`:`لا توجد أسئلة مسجلة في قاعدة البيانات بعد`;
    renderRecharts(`${scope}_chartMount`,stats.chartData,selectedType);
    const listEl=document.getElementById(`${scope}_subList`);
    if(listEl){
      listEl.innerHTML=stats.allSubjects.map(s=>{
        const pct=s.questions?Math.round((s.answered/s.questions)*100):0;
        return `<div style="background:#f9f9fb;border-radius:16px;padding:12px 14px;border:1px solid #f0f0f3"><div class="row" style="justify-content:space-between;margin-bottom:6px"><div><b style="font-size:15px">${esc(s.subject)}</b><span class="tag" style="margin-right:6px;font-size:11px">${YN[s.year]||''}</span></div><div class="row" style="gap:6px"><button type="button" class="btn s o" data-filter-sub="${esc(s.subject)}" style="font-size:12px;padding:3px 10px">تصفح الأسئلة</button><button type="button" class="btn s" data-ask-sub="${esc(s.subject)}" style="font-size:12px;padding:3px 10px;background:var(--c);color:#fff">اسأل بالمادة</button></div></div><div class="row" style="justify-content:space-between;font-size:13px;color:#6b7280;margin-bottom:4px"><span>الأسئلة: <b>${s.questions}</b></span><span>المجابة: <b style="color:#10b981">${s.answered}</b> (${pct}%)</span><span>تفاعل الطلاب: <b style="color:#7928ca">${s.interactions}</b></span></div><div class="bar2" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>`;
      }).join("")||"<p class='meta'>لا توجد مواد مسجلة</p>";
      listEl.onclick=e=>{
        const filterBtn=e.target.closest("[data-filter-sub]");
        const askBtn=e.target.closest("[data-ask-sub]");
        if(filterBtn){
          fs=filterBtn.dataset.filterSub;
          fa=0;
          location.hash="#/";
          const sh=document.getElementById("sh");
          if(sh)sh.remove();
        }else if(askBtn){
          sessionStorage.draftSubject=askBtn.dataset.askSub;
          location.hash="#/ask";
          const sh=document.getElementById("sh");
          if(sh)sh.remove();
        }
      };
    }
  };
  const yc=document.getElementById(`${scope}_yearChips`);
  if(yc){
    yc.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",+c.dataset.y===selectedYear));
    yc.onclick=e=>{
      const b=e.target.closest(".chip");
      if(!b)return;
      yc.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
      b.classList.add("on");
      selectedYear=+b.dataset.y;
      update();
    };
  }
  const tc=document.getElementById(`${scope}_typeChips`);
  if(tc){
    tc.onclick=e=>{
      const b=e.target.closest(".chip");
      if(!b)return;
      tc.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
      b.classList.add("on");
      selectedType=b.dataset.t;
      update();
    };
  }
  const refBtn=document.getElementById(`${scope}_refreshBtn`);
  if(refBtn){
    refBtn.onclick=()=>{
      toast("جارٍ تحديث الإحصائيات من قاعدة البيانات…");
      loadQ().then(update).catch(update);
    };
  }
  const toggleBtn=document.getElementById(`${scope}_toggleFeedBtn`);
  if(toggleBtn){
    toggleBtn.onclick=()=>{
      if(localStorage.hideStatsCard==='1'){
        localStorage.removeItem('hideStatsCard');
        toast("تمت استعادة بطاقة الإحصائيات في الصفحة الرئيسية");
      }else{
        localStorage.hideStatsCard='1';
        toast("تم حذف بطاقة الإحصائيات من الصفحة الرئيسية");
      }
      const txt=document.getElementById(`${scope}_toggleFeedTxt`);
      if(txt)txt.textContent=localStorage.hideStatsCard==='1'?'إظهار في الرئيسية':'حذف من الرئيسية';
      if(location.hash==='#/'||location.hash==='')feed();
    };
  }
  update();
}

function faqH(){
return `<div class="box" style="text-align:center;background:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 2px 16px #0000000a"><div class="ava big" style="background:#c4234114;color:var(--c);margin-bottom:8px">${I(IC.help)}</div><h2 style="margin-bottom:6px">دليل وتعليمات ومعايير منصة الطب البيطري</h2><p class="meta" style="line-height:1.8">منصة "اسأل دكتور وائل" التعليمية لطلاب كلية الطب البيطري - دليلك الشامل لطرح الأسئلة البيطرية، فهم معايير المنصة، واستخدام ميزات الذكاء الاصطناعي، الرسوم البيانية التفاعلية (Recharts)، والتنبيهات الفورية.</p></div>

<div class="box" style="background:#fff;border-radius:22px;border-right:4px solid var(--c);padding:18px;margin-bottom:14px;box-shadow:0 2px 14px #0000000a"><div class="row" style="gap:10px;margin-bottom:8px"><div class="ava" style="background:#c4234120;color:var(--c)">${I(IC.shield)}</div><h3 style="margin:0;font-size:18px;color:var(--c)">معايير وضوابط المنصة وسياسة النشر لطلاب الطب البيطري</h3></div><p style="font-size:14px;line-height:1.8;color:#333;margin-bottom:8px">المنصة مجتمع أكاديمي بيطري راقٍ مخصص لدعم طلاب الطب البيطري. يرجى الالتزام بالمعايير التالية:</p><ul style="padding-right:20px;font-size:14px;line-height:1.9;color:#444"><li><b>طبيعة الموضوعات البيطرية وأسماء الحيوانات:</b> المنصة مخصصة لعلوم الطب البيطري؛ وأسماء الحيوانات (مثل: الخيول، الأبقار، الأغنام، الماعز، الإبل، الكلاب، القطط، الدواجن، والطيور) وأعضائها التشريحية والتناسلية والفحوصات السريرية والشرجية هي موضوعات دراسية طبيعية وأصيلة ومقبولة تماماً.</li><li><b>الاحترام والآداب الجامعية:</b> يُحظر تماماً أي سباب، شتائم، قذف، تنمر، أو ألفاظ بذيئة موجهة لأي طالب أو أستاذ.</li><li><b>معايير الرفق بالحيوان (Animal Welfare):</b> يُمنع منعاً باتاً نشر أي محتوى يحرّض على القسوة غير المبررة تجاه الحيوان أو إيذائه خارج الإطار الجراحي والطبي والأكاديمي المعترف به.</li><li><b>خصوصية المزارع والعيادات:</b> عند إرفاق صور لحالات سريرية أو مزارع، يُراعى عدم إظهار بيانات هويات أو أرقام هواتف ملاك الحيوانات دون موافقتهم.</li><li><b>المحتوى العلمي البحت:</b> المنصة مخصصة للمقررات البيطرية (التشريح، الفسيولوجيا، الباثولوجيا، الأدوية، التوليد، الجراحة، الباطنة، الطفيليات، والإحصاء الحيوي البيطري). يُمنع أي نشر ترويجي أو إعلاني تجاري (Spam).</li></ul></div>

<div class="box" style="background:#fff;border-radius:22px;border-right:4px solid #2563eb;padding:18px;margin-bottom:14px;box-shadow:0 2px 14px #0000000a"><div class="row" style="gap:10px;margin-bottom:8px"><div class="ava" style="background:#2563eb20;color:#2563eb">${I(IC.edit)}</div><h3 style="margin:0;font-size:18px;color:#2563eb">طريقة طرح السؤال البيطري خطوة بخطوة</h3></div><div style="font-size:14px;line-height:1.9;color:#444"><p><b>1. اختيار المادة والفرقة:</b> حدد المادة البيطرية المناسبة والفرقة الدراسية لضمان وصول السؤال للمتخصصين وزملائك في نفس المرحلة.</p><p><b>2. تحديد الفصيلة الحيوانية:</b> وضّح في سؤالك نوع الحيوان المعني (مثل: مجترات، خيليات، حيوانات أليفة، دواجن) والأعراض أو المسألة المنهجية بدقة.</p><p><b>3. تحسين الصياغة بالذكاء الاصطناعي:</b> يمكنك الضغط على زر <b>تحسين الصياغة بالذكاء الاصطناعي</b> لإعادة صياغة السؤال بمصطلحات بيطرية ولاتينية وأكاديمية دقيقة.</p><p><b>4. إرفاق الصور التوضيحية:</b> يمكنك إرفاق حتى 5 صور للعينات المجهرية، صور الأشعة، المخططات التشريحية، أو مسائل الامتحانات.</p><p><b>5. معدل النشر:</b> يُسمح بطرح سؤالين كل ساعة لكل طالب بيطري لضمان جودة المتابعة وإتاحة الفرصة العادلة للجميع.</p></div></div>

<div class="box" style="background:#fff;border-radius:22px;border-right:4px solid #059669;padding:18px;margin-bottom:14px;box-shadow:0 2px 14px #0000000a"><div class="row" style="gap:10px;margin-bottom:8px"><div class="ava" style="background:#05966920;color:#059669">${I(IC.chart)}</div><h3 style="margin:0;font-size:18px;color:#059669">إحصائيات المنصة التفاعلية (Recharts)</h3></div><p style="font-size:14px;line-height:1.8;color:#444">تتضمن المنصة نظام رسوم بيانية تفاعلي مبني بتقنية <b>Recharts</b> يمكنك فتحه من زر <b>الإحصائيات</b> في الشريط العلوي أو التبويب السفلي. يتيح لك النظام:</p><ul style="padding-right:20px;font-size:14px;line-height:1.9;color:#444"><li>متابعة عدد الأسئلة المطروحة لكل مادة بيطرية.</li><li>معرفة عدد ونسبة الأسئلة المجابة بواسطة دكتور وائل في كل تخصص.</li><li>قياس تفاعل الطلاب (التعليقات والإعجابات) ومقارنة التفاعل بين المواد.</li><li>التبديل بين مخطط الأعمدة (Bar Chart)، التوزيع الدائري (Pie Chart)، ومنحنى التفاعل (Area Chart).</li></ul></div>

<div class="box" style="background:#fff;border-radius:22px;border-right:4px solid #7928ca;padding:18px;margin-bottom:14px;box-shadow:0 2px 14px #0000000a"><div class="row" style="gap:10px;margin-bottom:8px"><div class="ava" style="background:#7928ca20;color:#7928ca">${I(IC.sparkles)}</div><h3 style="margin:0;font-size:18px;color:#7928ca">ميزات الذكاء الاصطناعي والتنبيهات الفورية (FCM)</h3></div><div style="font-size:14px;line-height:1.9;color:#444"><p><b>• المساعد البيطري الذكي:</b> يقدم شروحات فورية واستشارات في الطب البيطري والإحصاء الحيوي بضغطة زر من الزر البنفسجي العلوي.</p><p><b>• التدقيق الآلي والرقابة الذكية:</b> فحص ذكي للمنشورات يحجب الإساءات والسبام فقط، مع مراعاة وفهم المصطلحات البيطرية المشروعة.</p><p><b>• التنبيهات الفورية (Push Notifications):</b> عند تفعيل الإشعارات من صفحة <b>حسابي > الإشعارات</b>، ستصلك تنبيهات فورية عبر Firebase Cloud Messaging على هاتفك فور إجابة دكتور وائل على سؤالك.</p></div></div>

<div class="box" style="background:#fff;border-radius:22px;padding:18px;margin-bottom:14px"><h3 style="margin-bottom:12px">الأسئلة الشائعة لطلاب الطب البيطري (FAQ)</h3><div style="display:flex;flex-direction:column;gap:10px"><details style="background:var(--g);border-radius:14px;padding:12px 16px;cursor:pointer"><summary style="font-family:T2,sans-serif;color:var(--t);font-size:15px"><b>من يجيب على الأسئلة في المنصة؟</b></summary><p class="meta" style="margin-top:8px;line-height:1.8;color:#444">يجيب على الأسئلة دكتور وائل بصورة دورية، مع إمكانية توليد شروحات فورية بواسطة المساعد البيطري الذكي، بالإضافة إلى تبادل الخبرات ومناقشات الزملاء بالتعليقات.</p></details><details style="background:var(--g);border-radius:14px;padding:12px 16px;cursor:pointer"><summary style="font-family:T2,sans-serif;color:var(--t);font-size:15px"><b>كيف أتابع المواد الأكثر نشاطاً وإجابة؟</b></summary><p class="meta" style="margin-top:8px;line-height:1.8;color:#444">من خلال صفحة أو مودال "الإحصائيات" (Recharts)، ستجد رسوماً بيانية توضح نسب الأسئلة وإجابات دكتور وائل ومستوى تفاعل الطلاب لكل مادة.</p></details><details style="background:var(--g);border-radius:14px;padding:12px 16px;cursor:pointer"><summary style="font-family:T2,sans-serif;color:var(--t);font-size:15px"><b>هل يمكنني الاستفسار عن حالات سريرية حقيقية لحيوانات؟</b></summary><p class="meta" style="margin-top:8px;line-height:1.8;color:#444">نعم بكل تأكيد، الاستفسارات السريرية والتشخيصية للحيوانات مرحب بها جداً طالما صِيغت بأسلوب علمي دون كشف بيانات سرية لأصحاب الحالات.</p></details><details style="background:var(--g);border-radius:14px;padding:12px 16px;cursor:pointer"><summary style="font-family:T2,sans-serif;color:var(--t);font-size:15px"><b>ماذا أفعل إذا تم حجب سؤالي من الذكاء الاصطناعي؟</b></summary><p class="meta" style="margin-top:8px;line-height:1.8;color:#444">تأكد من خلو السؤال من أي ألفاظ دارجة قد تلتبس على النظام، واستعن بزر "تحسين الصياغة بالذكاء الاصطناعي" لكتابة السؤال بلغة بيطرية وأكاديمية رصينة.</p></details></div></div>`;
}
